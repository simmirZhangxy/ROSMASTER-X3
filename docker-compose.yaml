services:
  yahboom_x3:
    build:
      context: .
      dockerfile: Dockerfile
    image: yahboom-x3:foxy
    container_name: yahboom_x3
    restart: unless-stopped
    network_mode: host
    security_opt:
      - apparmor:unconfined
    environment:
      DISPLAY: ${DISPLAY:-:0}
      QT_X11_NO_MITSHM: "1"
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-12}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /dev:/dev          # 关键：随时看到最新 USB
    privileged: true
    stdin_open: true
    tty: true